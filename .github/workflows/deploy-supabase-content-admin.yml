name: Deploy Supabase content-admin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-content-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy content-admin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy content-admin --project-ref jrrsnpijbizbwxopyvam --no-verify-jwt
