name: Project tests

on:
  push:
    branches:
      - main
      - feature/unified-student-access
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ihsan-tests-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
