name: Build Ihsan Android APK

on:
  push:
    branches:
      - feat/ihsan-android-apk
    paths:
      - "android-app/**"
      - ".github/workflows/build-ihsan-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ihsan-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
