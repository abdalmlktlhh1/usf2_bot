<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b34">
<title>لوحة الإدارة | إحسان</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light;--ink:#172d28;--muted:#697a74;--green:#176b58;--deep:#123b34;--paper:#f3f6f2;--line:#dce6df;--white:#fff;--red:#a6423c;--gold:#bd8737;--shadow:0 12px 36px #17392d10}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 95% 0,#e1eee6 0,transparent 33%),var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{max-width:1200px;margin:auto;padding:18px 16px 55px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 23px;background:linear-gradient(125deg,var(--deep),#1e6c57);color:#fff;border-radius:23px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;display:grid;place-items:center;border:1px solid #ffffff40;background:#ffffff12;border-radius:14px;font-size:1.25rem;font-weight:900}.header h1{font-size:clamp(1.2rem,3.6vw,1.75rem);margin:0}.header p{margin:2px 0 0;color:#d5e9df;font-size:.9rem}
.owner-label{white-space:nowrap;border:1px solid #ffffff40;background:#ffffff12;border-radius:999px;padding:7px 11px;font-size:.82rem;font-weight:750}
.banner{display:none;margin-top:14px;padding:12px 14px;border:1px solid #edb7ae;border-radius:14px;background:#fff1ee;color:#8d302a}
.banner.show{display:block}.banner.success{border-color:#b5dbc5;background:#edf8f1;color:#176443}
.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:17px;margin-top:17px}
.nav{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:12px;padding:12px;background:#ffffffb8;border:1px solid var(--line);border-radius:18px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:right;border:1px solid transparent;background:transparent;color:#52655d;padding:10px 12px;border-radius:12px;font-weight:750}
.nav button.active{background:#e5f2ea;border-color:#cde2d4;color:var(--green)}
.nav button:hover{background:#f0f6f1}
.content{min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 14px}
.page-head h2{font-size:1.35rem;margin:0}.page-head p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.btn{border:1px solid transparent;border-radius:12px;padding:9px 14px;min-height:42px;font-weight:800;white-space:nowrap}
.btn.primary{background:var(--green);color:#fff}.btn.secondary{background:#edf4ef;border-color:#d6e4da;color:var(--green)}.btn.light{background:#fff;border-color:var(--line);color:#586b63}.btn.danger{background:#fff0ed;border-color:#f0ccc5;color:#a23b32}.btn.small{min-height:32px;padding:4px 9px;font-size:.83rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:14px}
.stat{padding:17px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 15px #183a2e05}.stat span{display:block;color:var(--muted);font-size:.86rem}.stat strong{display:block;margin-top:4px;font-size:1.65rem;color:var(--green);font-variant-numeric:tabular-nums}
.panel{padding:16px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px #17392d05}
.panel h3{margin:0 0 10px;font-size:1.04rem}
.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:13px}
table{border-collapse:collapse;width:100%;min-width:640px;background:#fff}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid #edf1ed;vertical-align:top}
th{background:#f5f8f5;color:#52665d;font-size:.84rem;white-space:nowrap}
td{font-size:.91rem}tr:last-child td{border-bottom:0}
.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;background:#edf7f0;color:#176b49;font-size:.78rem;font-weight:750}.status.off{background:#f0f1f0;color:#65716b}.status.warn{background:#fff4df;color:#8b631c}
.row-actions{display:flex;flex-wrap:wrap;gap:5px}
.row-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.row-actions .btn{min-height:36px;padding:7px 10px;font-size:.82rem;white-space:nowrap}
@media(max-width:640px){.row-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.row-actions .btn{width:100%;min-width:0}.table-wrap{overflow-x:auto}}
.presence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.presence-panel{min-width:0;padding:15px;background:#fff;border:1px solid var(--line);border-radius:16px}
.presence-panel.wide{grid-column:1/-1}
.presence-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.presence-head h3{margin:0;font-size:1rem}
.presence-count{display:inline-flex;align-items:center;justify-content:center;min-width:29px;height:27px;padding:0 8px;border-radius:999px;background:#e8f4ec;color:#176b49;font-weight:850;font-size:.86rem}
.presence-list{display:grid;gap:7px}
.presence-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 10px;border:1px solid #edf1ed;border-radius:12px;background:#fbfcfb;min-width:0}
.presence-copy{min-width:0}
.presence-name{display:block;font-weight:800;overflow-wrap:anywhere}
.presence-detail,.presence-time{display:block;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
.presence-time{text-align:left;white-space:nowrap;flex:0 0 auto}
.presence-empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:.88rem}
.presence-live{display:inline-flex;align-items:center;gap:5px;color:#176b49;font-size:.76rem;font-weight:800;white-space:nowrap}
.presence-dot{width:8px;height:8px;border-radius:50%;background:#2c9b61;box-shadow:0 0 0 3px #2c9b611c}
@media(max-width:640px){.presence-grid{grid-template-columns:1fr}.presence-panel.wide{grid-column:auto}.presence-time{font-size:.72rem}}

.empty{padding:30px 15px;text-align:center;color:var(--muted)}
.search{width:min(100%,330px);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#72a58e;box-shadow:0 0 0 3px #176b5814;outline:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:grid;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label,.field .label{font-size:.88rem;font-weight:800;color:#42554d}
input,select,textarea{width:100%;min-width:0;border:1px solid #d5e1d9;border-radius:11px;background:#fff;color:var(--ink);padding:10px 11px}
textarea{min-height:86px;resize:vertical}
.hint{font-size:.79rem;color:var(--muted);margin:1px 0 0}
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:15px;background:#0f29238a;backdrop-filter:blur(3px)}.modal.show{display:grid}
.form-error{display:none;margin:0 0 12px;padding:10px 12px;border:1px solid #edb7ae;border-radius:11px;background:#fff1ee;color:#8d302a;font-size:.9rem}.form-error.show{display:block}.modal-card{width:min(100%,680px);max-height:min(90dvh,900px);overflow:auto;padding:20px;border-radius:20px;background:#fff;box-shadow:0 25px 75px #071c1740}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.modal-head h2{margin:0;font-size:1.25rem}.close{border:0;border-radius:10px;background:#f0f4f1;color:#53665d;width:37px;height:37px;font-size:1.35rem}
.modal-actions{display:flex;justify-content:flex-start;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.permissions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fbfcfa;font-size:.84rem}.check input{width:17px;height:17px;flex:0 0 auto;margin-top:3px;padding:0;accent-color:var(--green)}
.scopes{border:1px solid var(--line);border-radius:12px;padding:11px}.scopes>label{display:flex;align-items:center;gap:8px;font-weight:800}.scopes>label input{width:17px}
.audit-details{max-width:320px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem;color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:20px}.maintenance-panel{max-width:620px;margin:10px auto;text-align:center;padding:28px}.maintenance-icon{font-size:3rem;margin-bottom:8px}.maintenance-panel h3{font-size:1.35rem;margin:12px 0 4px}.maintenance-state{display:flex;justify-content:space-between;align-items:center;margin:20px 0;padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:#f7faf7}.maintenance-panel>.btn{width:100%;min-height:50px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.nav{position:static;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.nav button{justify-content:center;text-align:center;padding:8px 5px;font-size:.86rem}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.shell{padding:10px 10px 35px}.header{padding:15px 14px;border-radius:18px}.logo{width:38px;height:38px}.owner-label{font-size:.72rem;padding:6px 8px}.nav{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px}.nav button{font-size:.8rem}.page-head{flex-direction:column}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:1.4rem}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.permissions{grid-template-columns:1fr}.panel{padding:12px}.modal-card{padding:15px}.page-head h2{font-size:1.2rem}}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div class="brand"><div class="logo">⚖</div><div><h1>لوحة إدارة إحسان</h1><p id="subtitle">إدارة المحتوى والصلاحيات</p></div></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end"><a class="btn secondary" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">← منصة إحسان</a><span class="owner-label" id="accountBadge">جارٍ التحقق…</span></div>
  </header>
  <div id="notice" class="banner" role="status"></div>
  <div class="layout">
    <nav id="nav" class="nav" aria-label="أقسام الإدارة">
      <button data-page="dashboard" class="active">◈ نظرة عامة</button>
      <button data-page="levels">▤ المستويات</button>
      <button data-page="courses">▧ المقررات</button>
      <button data-page="questions">☷ الأسئلة</button>
      <button data-page="reviewQueue">📋 قائمة المراجعة</button>
      <button data-page="models">▦ النماذج</button>
      <button data-page="botMenu" id="botMenuNav" hidden>☷ أزرار البوت</button>
      <button data-page="maintenance" id="maintenanceNav" hidden>🛠️ صيانة الموقع</button>
      <button data-page="students" id="studentsNav" hidden>♙ الطلاب والحسابات</button>
      <button data-page="moderators" id="moderatorsNav" hidden>♙ المشرفون</button>
      <button data-page="logs" id="logsNav" hidden>◷ سجل العمليات</button>
    </nav>
    <main id="content" class="content" aria-live="polite"><div class="panel empty">يتم التحقق من الصلاحيات وتحميل البيانات…</div></main>
  </div>
  <footer class="footer">تُطبّق الصلاحيات على الخادم أيضًا؛ إخفاء الأزرار ليس وسيلة الحماية الوحيدة.</footer>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <section class="modal-card">
    <div class="modal-head"><h2 id="modalTitle">إضافة</h2><button id="modalClose" class="close" type="button" aria-label="إغلاق">×</button></div>
    <form id="entityForm"><div id="formError" class="form-error" role="alert"></div><div id="formFields"></div><div class="modal-actions"><button type="submit" class="btn primary" id="saveBtn">حفظ</button><button type="button" class="btn light" id="cancelBtn">إلغاء</button></div></form>
  </section>
</div>

<script>
(function () {
  const webApp = window.Telegram && window.Telegram.WebApp;
  if (webApp) { webApp.ready(); webApp.expand(); }
  const $ = (id) => document.getElementById(id);
  const PERMISSIONS = [
    ['levels.read','عرض المستويات'],['levels.write','إضافة وتعديل المستويات'],
    ['subjects.read','عرض المواد'],['subjects.write','إضافة وتعديل المواد'],
    ['courses.read','عرض المقررات'],['courses.write','إضافة وتعديل المقررات'],
    ['questions.read','عرض الأسئلة والإجابات'],['questions.write','إضافة وتعديل الأسئلة'],
    ['questions.publish','نشر الأسئلة وإلغاء نشرها'],['questions.delete','أرشفة الأسئلة'],
    ['statistics.read','عرض إحصائيات المحتوى'],['audit.read','عرض سجل العمليات'],
    ['students.read','عرض حسابات الطلاب وحالاتها']
  ];
  const ROLE_DEFAULTS = {
    academic_manager: ['levels.read','levels.write','subjects.read','subjects.write','courses.read','courses.write','questions.read','questions.write','questions.publish','statistics.read','students.read'],
    question_editor: ['courses.read','questions.read','questions.write'],
    reviewer: ['courses.read','questions.read','questions.publish'],
    content_viewer: ['levels.read','subjects.read','courses.read','questions.read'],
    statistics_viewer: ['statistics.read'],
    auditor: ['audit.read','statistics.read'],
    custom: []
  };
  const ROLE_NAMES = {
    academic_manager:'مدير محتوى أكاديمي', question_editor:'محرر أسئلة',
    reviewer:'مراجع وناشر', content_viewer:'مشاهدة فقط',
    statistics_viewer:'إحصائيات فقط', auditor:'مراجع سجل العمليات', custom:'صلاحيات مخصصة'
  };
  let state = null;
  let activePage = 'dashboard';
  let editItem = null;
  let searchValue = '';
  let questionPage = 1;
  let questionModelFilter = null;
  const questionPageSize = 25;
  let questionTotal = 0;
  let questionSearchTimer = null;
  let menuItems = [];
  let visitorRefreshTimer = null;
  let visitorRefreshBusy = false;

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[ch]);
  }
  function showNotice(message, success = false) {
    $('notice').textContent = message;
    $('notice').className = 'banner show' + (success ? ' success' : '');
    if (success) setTimeout(() => { $('notice').classList.remove('show'); }, 3500);
  }
  async function waitForTelegramServerless(maxAttempts = 30) {
    try { window.Telegram?.WebApp?.ready?.(); window.Telegram?.WebApp?.expand?.(); } catch (_) {}
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const app = window.Telegram?.WebApp;
      // Serverless can exist before Telegram has supplied initData; calling too early
      // triggers WebAppServerlessInitDataUnavailable and leaves the page in a bad state.
      if (app?.Serverless?.call && (typeof app.initData === 'string' && app.initData.length > 0 || app.initDataUnsafe?.user?.id)) return app;
      await new Promise((resolve) => setTimeout(resolve, 150));
    }
    throw new Error('لم تصل بيانات التحقق من Telegram. افتح اللوحة من زر «لوحة الإدارة» داخل البوت، ثم أعد المحاولة.');
  }
  const BROWSER_ADMIN_API_URL = "https://jrrsnpijbizbwxopyvam.supabase.co/functions/v1/content-admin";
  async function api(action, payload = {}) {
    const telegramApp = window.Telegram?.WebApp;
    if (!telegramApp?.Serverless?.call) {
      let session = null;
      try { session = JSON.parse(sessionStorage.getItem("usf2_student_session_v1") || "null"); } catch {}
      if (!session?.accessToken) throw new Error("سجّل الدخول بحساب المدير من المتصفح أولًا.");
      const response = await fetch(BROWSER_ADMIN_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.accessToken },
        body: JSON.stringify({ action, payload })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "تعذر تنفيذ العملية الإدارية.");
      return result;
    }
    const app = await waitForTelegramServerless();
    return new Promise((resolve, reject) => {
      let settled = false;
      const timeout = setTimeout(() => {
        if (settled) return;
        settled = true;
        reject(new Error('انتهت مهلة اتصال لوحة الإدارة بالخادم. أعد المحاولة؛ لم تتغير بياناتك.'));
      }, action === 'dashboard' ? 25000 : 18000);
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        callback(value);
      };
      try {
        app.Serverless.call('adminApi', { action, ...payload }, (err, result) => {
          if (err) finish(reject, new Error(err.description || err.message || 'تعذر تنفيذ العملية.'));
          else if (result === undefined || result === null) finish(reject, new Error('لم يُرجع الخادم بيانات. أعد المحاولة.'));
          else finish(resolve, result);
        });
      } catch (error) {
        finish(reject, new Error(error?.message || 'تعذر الاتصال بخادم الإدارة.'));
      }
    });
  }
  function can(permission) {
    return Boolean(state?.user?.isOwner || state?.permissions?.includes('*') || state?.permissions?.includes(permission));
  }
  function canCatalog(permission) {
    return can(permission) && Boolean(state?.canManageCatalog);
  }
  function scopeAll() {
    return Boolean(state?.user?.isOwner || state?.courses?.length === state?.allCoursesCount);
  }
  function idName(rows, id, key = 'name') {
    return rows?.find((row) => Number(row.id) === Number(id))?.[key] || '—';
  }
  function status(active) {
    return '<span class="status' + (active ? '' : ' off') + '">' + (active ? 'نشط' : 'مؤرشف') + '</span>';
  }
  function button(label, action, id, kind = 'light') {
    return '<button class="btn small ' + kind + '" data-action="' + action + '" data-id="' + escapeHtml(id) + '">' + label + '</button>';
  }
  function startPage(title, description, addLabel, addAction, allowAdd = true) {
    return '<div class="page-head"><div><h2>' + title + '</h2><p>' + description + '</p></div>' +
      (allowAdd ? '<button class="btn primary" data-action="' + addAction + '">' + addLabel + '</button>' : '') + '</div>';
  }
  function table(headers, rows, emptyText = 'لا توجد سجلات في هذا القسم.') {
    if (!rows.length) return '<div class="panel empty">' + escapeHtml(emptyText) + '</div>';
    return '<div class="table-wrap"><table><thead><tr>' + headers.map((h) => '<th>' + h + '</th>').join('') +
      '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function filtered(rows, getter) {
    const term = searchValue.trim().toLowerCase();
    return !term ? rows : rows.filter((row) => getter(row).toLowerCase().includes(term));
  }
  function toolbar() {
    return '<div style="margin-bottom:12px"><input class="search" id="listSearch" type="search" placeholder="ابحث في السجلات…" value="' + escapeHtml(searchValue) + '"></div>';
  }
  function levelName(id) { return idName(state.levels, id); }
  function subjectName(id) { return idName(state.subjects, id); }
  function courseName(id) { return idName(state.courses, id); }

  function renderMaintenance() {
    const enabled = Boolean(state?.maintenance?.enabled);
    return startPage('صيانة الموقع','إيقاف ظهور منصة إحسان للطلاب مؤقتًا، ثم إعادتها بنقرة واحدة.','تحديث الحالة','refreshMaintenance',false) +
      '<div class="panel maintenance-panel"><div class="maintenance-icon">🛠️</div><span class="status ' + (enabled ? 'warn' : '') + '">' + (enabled ? 'الموقع تحت الصيانة' : 'الموقع يعمل بشكل طبيعي') + '</span><h3>' + (enabled ? 'وضع الصيانة مفعّل' : 'المنصة متاحة للطلاب') + '</h3><p class="muted">هذا الإعداد يتحكم في ظهور صفحة الصيانة للزوار، ولا يحذف الأسئلة أو حسابات الطلاب أو نتائجهم.</p><div class="maintenance-state"><span>حالة الموقع</span><strong>' + (enabled ? '🔒 صيانة' : '🟢 يعمل') + '</strong></div><button class="btn ' + (enabled ? 'primary' : 'danger') + '" data-action="toggleMaintenance">' + (enabled ? '✓ إنهاء الصيانة وإظهار الموقع' : '🛠️ تفعيل وضع الصيانة') + '</button><p class="hint">يستطيع المدير الرئيسي فقط تغيير هذه الحالة.</p></div>';
  }
  function adminDate(value) {
    if (!value) return '—';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString('ar-YE');
  }
  function visitorName(row) {
    return row.displayName || row.telegramName || row.accountUsername ||
      (row.telegramUsername ? '@' + row.telegramUsername : 'مستخدم تيليجرام');
  }
  function visitorDetail(row) {
    const parts = [];
    if (row.accountUsername) parts.push('حساب المنصة: ' + row.accountUsername);
    if (row.telegramUsername) parts.push('يوزر تيليجرام: @' + row.telegramUsername.replace(/^@/, ''));

  async function refreshVisitorPresence(showFeedback = false, refreshStudents = true) {
    if (!state?.user?.isOwner || visitorRefreshBusy) return;
    visitorRefreshBusy = true;
    try {
      const [analytics, studentResult] = await Promise.all([
        api('visitorList'),
        refreshStudents ? api('listStudents') : Promise.resolve(null)
      ]);
      if (!state) return;
      state.visitorAnalytics = analytics;
      if (studentResult) state.students = Array.isArray(studentResult.students) ? studentResult.students : [];
      state.stats = {
        ...(state.stats || {}),
        totalVisitors: analytics.totalVisitors ?? state.stats?.totalVisitors,
        currentUsers: analytics.currentUsers ?? state.stats?.currentUsers
      };
      if (activePage === 'dashboard') render();
      if (showFeedback) showNotice('تم تحديث قائمة المستخدمين.', true);
    } catch (error) {
      if (showFeedback) showNotice(error.message || 'تعذر تحديث قائمة المستخدمين.');
    } finally {
      visitorRefreshBusy = false;
    }
  }

  function buildModels() {
    const map = new Map();
    for (const q of state.questions || []) {
      const sourceYear = Number(q.sourceYear) || 0;
      const sourceFile = String(q.sourceFile || "بلا اسم");
      const key = encodeURIComponent(JSON.stringify([Number(q.courseId), sourceYear, sourceFile]));
      if (!map.has(key)) map.set(key, {
        id:key,courseId:Number(q.courseId),sourceYear,sourceFile,total:0,activeCount:0,isActive:false,
      });
      const model = map.get(key);
      model.total++;
      if (q.isActive) model.activeCount++;
      model.isActive = model.activeCount > 0;
    }
    return [...map.values()].sort((a,b) =>
      courseName(a.courseId).localeCompare(courseName(b.courseId),"ar") ||
      b.sourceYear-a.sourceYear || a.sourceFile.localeCompare(b.sourceFile,"ar"));
  }

    const rows = [];
    function walk(parentId, depth = 0, ancestors = []) {
      if (depth > 5) return;
      const siblings = all.filter((item) => (item.parentId == null ? null : Number(item.parentId)) === (parentId == null ? null : Number(parentId)));
      siblings.forEach((item, index) => {
        if (ancestors.includes(Number(item.id))) return;
        const parent = item.parentId == null ? null : all.find((entry) => Number(entry.id) === Number(item.parentId));
        const isFolder = item.type === 'submenu';

          button('↑','moveMenuUp',item.id,'light'),

  async function reload(keepPage = true) {
    const result = await api('dashboard');
    state = result;
    if (state.user?.isOwner && !visitorRefreshTimer && window.Telegram?.WebApp?.Serverless?.call) {
      visitorRefreshTimer = setInterval(() => {
        if (activePage === 'dashboard' && !document.hidden) refreshVisitorPresence(false, false);
      }, 30000);
    }
    state.questions = [];
    state.models = Array.isArray(result.models) ? result.models : [];
    questionTotal = Number(result.questionCount) || 0;
    menuItems = [];
    const backgroundTasks = [];
    if (result.user.isOwner) {
      backgroundTasks.push(api('getMaintenance').then((value) => { state.maintenance = value; })
        .catch(() => { state.maintenance = { enabled: false, message: '' }; }));
    }
    if (result.canManageModerators) {
      backgroundTasks.push(api('listBotMenuItems').then((value) => {
        menuItems = Array.isArray(value.items) ? value.items : [];
      }).catch((error) => { showNotice('تعذر تحميل أزرار البوت: ' + error.message); }));
    }
    if (result.user.isOwner || result.permissions.includes('*') || result.permissions.includes('students.read')) {
      backgroundTasks.push(api('listStudents').then((value) => {
        state.students = Array.isArray(value.students) ? value.students : [];
      }).catch((error) => { showNotice('تعذر تحميل حسابات الطلاب: ' + error.message); }));
    }
    // Do not block the first paint on optional admin-only data.
    // These requests update their own state when they finish and never hold the dashboard spinner.
    Promise.all(backgroundTasks).then(() => {
      if (!state) return;

      if (activePage === 'botMenu') render();
      if (activePage === 'maintenance' && state.user?.isOwner) render();
      if (activePage === 'students' || (activePage === 'dashboard' && state.user?.isOwner)) render();
    }).catch(() => {});
    state.menuItems = menuItems;
    $('botMenuNav').hidden = !result.canManageModerators;
    $('accountBadge').textContent = result.browserAdmin ? 'مدير المنصة' : result.user.isOwner ? 'المدير الرئيسي' : 'مشرف بصلاحيات محددة';

      };
      const inferredLevel = Number(target.levelId || (targetType === 'subject' ? subjectLevel(target.targetId) : targetType === 'course' ? courseLevel(target.targetId) : (targetType === 'model' ? courseLevel(target.courseId) : 0))) || Number(levels[0]?.id || 0);

  function openEntity(kind, item = null) {

  function updateCorrectOptions() {
    const select=$('correctIndex');if(!select)return;
    const prior=select.value;
    select.innerHTML='';
    for(let i=0;i<8;i++){
      const input=$('opt'+i);
      if(!input)break;
      const option=document.createElement('option');option.value=String(i);
      option.textContent=(i+1)+'. '+(input.value.trim() || 'الخيار '+(i+1));select.append(option);
    }
    if([...select.options].some(o=>o.value===prior))select.value=prior;
  }
  function formData() {
    const form=$('entityForm');const kind=editItem?._kind;
    const fd=new FormData(form);const id=fd.get('id') ? Number(fd.get('id')) : undefined;
    if(kind==='botMenu') { let value=fd.get('value') || ''; if(fd.get('type')==='catalog') { const targetType=fd.get('targetType'); let targetId=Number(fd.get('targetId')),courseId,sourceYear,sourceFile; if(targetType==='model'){try{[courseId,sourceYear,sourceFile]=JSON.parse(fd.get('targetId'));targetId=Number(courseId)}catch(_){}} value=JSON.stringify({targetType,targetId,courseId,sourceYear,sourceFile}); } return {id,parentId:fd.get('parentId') === '' ? null : Number(fd.get('parentId')),text:fd.get('text'),type:fd.get('type'),value,description:fd.get('description') || '',sortOrder:Number(fd.get('sortOrder') || 0),isActive:fd.get('isActive') === 'on',adminOnly:fd.get('adminOnly') === 'on'}; }
    if(kind==='level') return {id,name:fd.get('name'),description:fd.get('description'),sortOrder:Number(fd.get('sortOrder')||0)};
    if(kind==='subject') return {id,levelId:Number(fd.get('levelId')),name:fd.get('name'),description:fd.get('description'),sortOrder:Number(fd.get('sortOrder')||0)};
    if(kind==='course') return {id,subjectId:Number(fd.get('subjectId')),name:fd.get('name'),description:fd.get('description'),durationMinutes:Number(fd.get('durationMinutes')||60),passingScore:Number(fd.get('passingScore')||50),sortOrder:Number(fd.get('sortOrder')||0)};
    if(kind==='question'){
      const options=[];for(let i=0;i<8;i++){const value=String(fd.get('opt'+i)||'').trim();if(value)options.push({oldIndex:i,value})}
      const selectedOld=Number(fd.get('correctIndex'));
      const correctIndex=options.findIndex(o=>o.oldIndex===selectedOld);
      let sourceYear=0,sourceFile='لوحة الإدارة'; const rawModel=fd.get('questionModel');
      if(rawModel==='__new__'){sourceYear=Number(fd.get('newModelYear')||new Date().getFullYear());sourceFile=String(fd.get('newModelName')||'').trim()} else if(rawModel){try{const parsed=JSON.parse(rawModel);sourceYear=Number(parsed[1]||0);sourceFile=String(parsed[2]||'لوحة الإدارة')}catch(_){}}
      return {id,courseId:Number(fd.get('courseId')),sourceYear,sourceFile,questionText:fd.get('questionText'),options:options.map(o=>o.value),correctIndex,explanation:fd.get('explanation'),difficulty:fd.get('difficulty'),sortOrder:Number(fd.get('sortOrder')||0)};
    }
    if(kind==='model') return {courseId:Number(fd.get('courseId')),sourceYear:Number(fd.get('sourceYear')||0),sourceFile:fd.get('sourceFile'),newSourceYear:Number(fd.get('newSourceYear')||0),newSourceFile:fd.get('newSourceFile')};
    if(kind==='moderator'){
      const scopeAll=$('allScopes').checked;
      return {telegramId:Number(fd.get('telegramId')),displayName:fd.get('displayName')||'مشرف',roleKey:fd.get('roleKey'),permissions:fd.getAll('permission'),scopeCourseIds:scopeAll?['*']:Array.from($('scopeCourses').selectedOptions).map(o=>Number(o.value))};
    }
    return {};

  async function submitForm(event) {
    event.preventDefault();
    const kind=editItem?._kind;const payload=formData();
    const actions={level:'saveLevel',subject:'saveSubject',course:'saveCourse',question:'saveQuestion',model:'renameModel',moderator:'saveModerator',botMenu:'saveBotMenuItem'};
    if(kind==='question' && (!payload.courseId || !payload.sourceFile || !payload.questionText?.trim())){showNotice('اختر المستوى والمقرر والنموذج، أو أدخل بيانات النموذج الجديد.');return;}
    if(kind==='question' && (payload.options.length<2 || payload.correctIndex<0)){
      showNotice('أدخل خيارين على الأقل وحدد الإجابة الصحيحة من الخيارات غير الفارغة.');return;
    }
    if(kind==='model' && (!payload.sourceFile || !payload.newSourceFile || !payload.courseId)){
      showNotice('اسم النموذج والمقرر مطلوبان.');return;
    }
    if(kind==='moderator' && !payload.scopeCourseIds.length){
      showNotice('حدد نطاق المقررات، أو فعّل خيار جميع المقررات.');return;
    }
    if(kind==='botMenu' && !payload.text.trim()) { showNotice('اكتب اسم الزر.'); return; }
    $('saveBtn').disabled=true;$('saveBtn').textContent='جارٍ الحفظ…';
    try{
      await api(actions[kind],payload);closeModal();showNotice('تم حفظ التغييرات بنجاح.',true);await reload();
    }catch(error){showFormError(error.message || 'تعذر الحفظ؛ تحقق من الاتصال والصلاحيات ثم أعد المحاولة.')}
    finally{$('saveBtn').disabled=false;$('saveBtn').textContent='حفظ'}
  }
  async function toggleEntity(type,id) {
    const mapping={
      level:{field:'id',action:'setLevelActive',rows:state.levels,label:'المستوى'},
      subject:{field:'id',action:'setSubjectActive',rows:state.subjects,label:'المادة'},
      course:{field:'id',action:'setCourseActive',rows:state.courses,label:'المقرر'},
      question:{field:'id',action:'setQuestionActive',rows:state.questions,label:'السؤال'},
      model:{field:'id',action:'setModelActive',rows:state.models,label:'النموذج'},
      moderator:{field:'telegramId',action:'setModeratorActive',rows:state.moderators,label:'المشرف'}
    };
    const m=mapping[type];const row=m.rows.find(r=>String(r[m.field])===String(id));if(!row)return;
    const isActive=!row.isActive;
    const message=isActive?'تأكيد تفعيل '+m.label+'؟':'ستتم أرشفة '+m.label+' دون حذف بياناته. هل تريد المتابعة؟';
    if(!confirm(message))return;
    const payload=type==='model'
      ? {courseId:row.courseId,sourceYear:row.sourceYear,sourceFile:row.sourceFile,isActive}
      : {[m.field]:id,isActive};
    try{await api(m.action,payload);showNotice(isActive?'تم التفعيل.':'تمت الأرشفة.',true);await reload()}
    catch(error){showNotice(error.message)}
  }

      if (!confirm(suspended
        ? 'إعادة تفعيل حساب «' + display + '»؟ ستعود إمكانية الدخول مع بقاء نتائجه السابقة.'
        : 'إيقاف حساب «' + display + '»؟ سيُمنع من الدخول دون حذف نتائجه أو تقدمه.')) return;
      try {
        await api('setStudentStatus', { userId: student.userId, status: nextStatus });
        showNotice(suspended ? 'تمت إعادة تفعيل الحساب.' : 'تم إيقاف الحساب.', true);
        await reload(true);
      } catch (error) { showNotice(error.message || 'تعذر تحديث حالة الحساب.'); }

      try { state.maintenance = await api('setMaintenance', { enabled, message: 'الموقع تحت الصيانة حاليًا. نعمل على تحسين الخدمة، يرجى العودة لاحقًا.' }); render(); showNotice(enabled ? 'تم تفعيل وضع الصيانة.' : 'تم إظهار الموقع للطلاب.', true); }

    }
    if (action === 'editBotMenu') {
      const item=menuItems.find((row)=>String(row.id)===String(id));
      if(item) openEntity('botMenu',item);
      return;
    }
    if (action === 'addBotChild') {
      const parent=menuItems.find((row)=>String(row.id)===String(id));
      if(!parent || parent.type!=='submenu') { showNotice('اختر زرًا من نوع قائمة فرعية أولًا.'); return; }
      const children=menuItems.filter((row)=>Number(row.parentId)===Number(parent.id));
      openEntity('botMenu',{parentId:Number(parent.id),sortOrder:(children.length+1)*10,isActive:true,adminOnly:Boolean(parent.adminOnly)});
      return;
    }
    if (action === 'moveMenuUp' || action === 'moveMenuDown') {
      try { const result=await api('moveBotMenuItem',{id:Number(id),direction:action==='moveMenuUp'?'up':'down'}); if(!result.moved){showNotice('الزر موجود بالفعل في هذا الطرف من القائمة.');return;} showNotice('تم تغيير ترتيب الزر.',true);await reload(); }
      catch(error){showNotice(error.message)}
      return;
    }
    if (action === 'toggleBotMenu') {
      const item=menuItems.find((row)=>String(row.id)===String(id));if(!item)return;
      const isActive=!item.isActive;
      if(!confirm(isActive?'إظهار هذا الزر للمستخدمين؟':'إخفاء هذا الزر من قائمة البوت؟'))return;
      try { await api('toggleBotMenuItem',{id:Number(id),isActive});showNotice(isActive?'تم إظهار الزر.':'تم إخفاء الزر.',true);await reload(); }
      catch(error){showNotice(error.message)}
      return;
    }
    if (action === 'deleteBotMenu') {
      const item=menuItems.find((row)=>String(row.id)===String(id));if(!item)return;
      if(!confirm('حذف زر «'+item.text+'» نهائيًا؟ لن يُحذف أي محتوى دراسي، لكن هذا الزر سيُزال من قائمة البوت.'))return;
      try { await api('deleteBotMenuItem',{id:Number(id)});showNotice('تم حذف الزر.',true);await reload(); }
      catch(error){showNotice(error.message)}
      return;
    }
    if (action === 'prevQuestionPage' && questionPage > 1) {
      questionPage--;
      try { await loadQuestionsPage(false); } catch (error) { showNotice(error.message); }
      return;
    }
    if (action === 'nextQuestionPage' && questionPage < Math.max(1, Math.ceil(questionTotal / questionPageSize))) {
      questionPage++;
      try { await loadQuestionsPage(false); } catch (error) { showNotice(error.message); }
      return;
    }
    if (action === 'importModelJson') {
      if (!state?.user?.isOwner) { showNotice('استيراد النماذج متاح للمدير الرئيسي فقط.'); return; }
      const courseId=Number($('jsonModelCourse')?.value);
      const sourceYear=Number($('jsonModelYear')?.value);
      const sourceFile=String($('jsonModelName')?.value||'').trim();
      let parsed;
      try { parsed=JSON.parse(String($('jsonModelInput')?.value||'')); }
      catch (_) { showNotice('كود JSON غير صالح؛ راجع الفواصل والأقواس.'); return; }
      const questions=Array.isArray(parsed)?parsed:parsed?.questions;
      if(!courseId || !sourceFile || !Array.isArray(questions) || !questions.length) { showNotice('حدد المادة واسم النموذج، وتأكد أن JSON يحتوي مصفوفة questions غير فارغة.'); return; }
      if(questions.length>500) { showNotice('الحد الأقصى 500 سؤال في عملية الاستيراد الواحدة.'); return; }
      if(!confirm('سيتم استيراد '+questions.length+' سؤالًا إلى «'+sourceFile+'» وحفظها في قاعدة البيانات. متابعة؟')) return;
      const btn=$('importModelJsonBtn'); if(btn){btn.disabled=true;btn.textContent='جارٍ استيراد الأسئلة…';}
      try {
        const result=await api('importModelJson',{courseId,sourceYear,sourceFile,questions});
        showNotice('تم استيراد '+result.imported+' سؤالًا إلى النموذج بنجاح.',true);
        $('jsonModelInput').value='';
        await reload();
      } catch(error) { showNotice(error.message||'تعذر استيراد النموذج.'); }
      finally { const current=$('importModelJsonBtn'); if(current){current.disabled=false;current.textContent='⬆ استيراد النموذج والأسئلة';} }
      return;
    }
    if (action === 'viewModelQuestions') {
      const [courseId,file,year]=JSON.parse(decodeURIComponent(id));
      questionModelFilter={courseId:Number(courseId),sourceFile:String(file||'بلا اسم'),sourceYear:Number(year)||0};
      searchValue='';questionPage=1;activePage='questions';
      document.querySelectorAll('#nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='questions'));
      try { await loadQuestionsPage(true); showNotice('عرض أسئلة النموذج: '+file+' · '+year,true); } catch(error) { showNotice(error.message); }
      return;
    }
    if (action === 'addSubjectQuestion' || action === 'addModelQuestion') {
      let item={};
      if(action==='addSubjectQuestion') {
        const subject=(state.subjects||[]).find(x=>Number(x.id)===Number(id));
        const course=(state.courses||[]).find(x=>Number(x.subjectId)===Number(subject?.id));
        if(course)item.courseId=course.id;
      } else {
        const [subjectId,courseId,year,file]=JSON.parse(decodeURIComponent(id));
        item={courseId:Number(courseId),sourceYear:Number(year)||0,sourceFile:String(file||'')};
      }
      openEntity('question',item);return;
    }
    const types={
      addLevel:['level',null],editLevel:['level',(state.levels||[]).find(r=>String(r.id)===id)],
      addSubject:['subject',null],editSubject:['subject',(state.subjects||[]).find(r=>String(r.id)===id)],
      addCourse:['course',null],editCourse:['course',(state.courses||[]).find(r=>String(r.id)===id)],
      addQuestion:['question',null],editQuestion:['question',(state.questions||[]).find(r=>String(r.id)===id)],
      editReviewQuestion:['question',(state.questions||[]).find(r=>String(r.id)===id)],
      addModel:['model',null],editModel:['model',(state.models||[]).find(r=>String(r.id)===id)],
      addModerator:['moderator',null],editModerator:['moderator',(state.moderators||[]).find(r=>String(r.telegramId)===id)]
    };
    if(types[action]){openEntity(types[action][0],types[action][1]||null);return}
    if(action.startsWith('toggle')){await toggleEntity(action.slice(6).toLowerCase(),id);return}
    if(action==='refresh'){try{await reload();showNotice('تم تحديث البيانات.',true)}catch(error){showNotice(error.message)}}
  });
  $('entityForm').addEventListener('submit',submitForm);
  $('modalClose').addEventListener('click',closeModal);$('cancelBtn').addEventListener('click',closeModal);
  $('modal').addEventListener('click',(event)=>{if(event.target===$('modal'))closeModal()});
  document.addEventListener('keydown',(event)=>{if(event.key==='Escape')closeModal()});

  async function init() {
    try { await reload(false); }
    catch(error) {
      const errorText = String(error?.message || 'تعذر تحميل البيانات.');
      const accessProblem = /غير مخوّل|مخول|صلاحية|Telegram|UNAUTHENTICATED|FORBIDDEN/i.test(errorText);
      $('accountBadge').textContent = accessProblem ? 'غير مصرح' : 'تعذر الاتصال';
      $('content').innerHTML='<div class="panel empty"><h2>تعذّر فتح لوحة الإدارة</h2><p>'+escapeHtml(errorText)+'</p><p>يمكنك إعادة المحاولة دون إعادة فتح الصفحة. إذا استمر الخطأ فسيظهر سبب الاتصال بدل بقاء التحميل معلقًا.</p><button class="btn primary" type="button" data-action="refresh" style="margin:8px">↻ إعادة المحاولة</button><a class="btn secondary" href="index.html" style="display:inline-block;text-decoration:none;margin:8px">العودة للاختبار</a></div>';
      $('nav').hidden=true;
      showNotice(error.message);
    }
  }
  // Independent watchdog: if Telegram's Serverless bridge never calls back, don't leave a permanent spinner.
  const startupWatchdog = setTimeout(() => {
    const loading = !state && $('nav').hidden === false && $('content').textContent.includes('يتم التحقق');
    if (!loading || state) return;
    $('accountBadge').textContent = 'تعذر بدء الاتصال';
    $('content').innerHTML = '<div class="panel empty"><h2>تعذّر بدء الاتصال بلوحة الإدارة</h2><p>لم يستجب جسر الاتصال داخل Telegram. افتح اللوحة من زر الإدارة في البوت بعد تحديثه، ثم أعد المحاولة.</p><button class="btn primary" type="button" data-action="refresh" style="margin:8px">↻ إعادة المحاولة</button></div>';
    showNotice('انتهت مهلة بدء الاتصال؛ لم يتم تغيير أي بيانات.');
  }, 12000);
  init().finally(() => clearTimeout(startupWatchdog));
})();
</script>
</body>
</html>
