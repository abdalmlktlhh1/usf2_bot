name: Deploy Supabase student transfer functions

on:
  workflow_dispatch:
  push:
    branches:
      - feature/student-level-transfer

permissions:
  contents: read

jobs:
  deploy-transfer-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy content-admin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy content-admin --project-ref jrrsnpijbizbwxopyvam --no-verify-jwt

      - name: Deploy browser-student-data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy browser-student-data --project-ref jrrsnpijbizbwxopyvam --no-verify-jwt
